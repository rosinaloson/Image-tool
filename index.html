<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e88dad">
<link rel="icon" type="image/png" href="./E618184A-3D1D-488F-B088-F19F9A709356.png">
<link rel="apple-touch-icon" href="./E618184A-3D1D-488F-B088-F19F9A709356.png">
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="圖片整理工具"><title>🌷 圖片整理小工具 V2</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff8fb;color:#5b404c;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}.wrap{max-width:720px;margin:auto;padding:16px 12px 40px}h1{text-align:center;font-size:24px;margin:5px}.sub{text-align:center;color:#9b7b89;font-size:12px;margin-bottom:14px}.card{background:white;border:1px solid #efd4df;border-radius:18px;padding:14px;margin:11px 0;box-shadow:0 4px 14px #e8b7c733}label{font-size:14px;font-weight:700;display:block;margin-bottom:7px}input,select{width:100%;height:43px;border:1px solid #e6ccd7;border-radius:11px;padding:0 10px;font-size:16px;color:#5b404c;background:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.pick,button{border:0;border-radius:12px;min-height:43px;padding:10px 13px;font-size:15px;font-weight:700}.pick{display:flex;align-items:center;justify-content:center;background:#f8dbe5;color:#74485a}#picker{display:none}.primary{width:100%;background:#e88dad;color:white;font-size:17px}.soft{background:#f7eaf0;color:#74485a}.danger{background:#fff0f3;color:#b55d78}.hint{font-size:12px;color:#9b7b89;line-height:1.55;margin-top:7px}.stat{display:flex;justify-content:space-between;font-size:13px}.list{display:grid;gap:8px;margin-top:9px}.item,.result{display:grid;grid-template-columns:52px 1fr auto;gap:9px;align-items:center;border:1px solid #efd4df;border-radius:13px;padding:6px}.thumb{width:52px;height:52px;object-fit:cover;border-radius:9px;background:#f8edf2}.name{font-size:12px;word-break:break-all}.name b{font-size:13px}.size{font-size:11px;color:#9b7b89;margin-top:3px}.mini{min-height:30px;padding:4px 8px;background:#f7eaf0;color:#74485a;font-size:12px}.btns{display:flex;flex-direction:column;gap:4px}.save{background:#f7d8e4;color:#74485a;min-height:36px;padding:8px 10px;text-decoration:none;text-align:center;border-radius:10px;font-size:13px}.progress{height:9px;background:#f4e4eb;border-radius:99px;overflow:hidden;margin:9px 0}.bar{height:100%;width:0;background:#e88dad}.status{text-align:center;font-size:12px;color:#9b7b89;min-height:18px}.range{display:flex;align-items:center;gap:8px}.range input{flex:1;accent-color:#e88dad}@media(max-width:430px){.wrap{padding:12px 10px}.grid{gap:7px}}
</style></head><body><div class="wrap"><h1>🌷 圖片整理小工具</h1><div class="sub">手機優先・批次改名・壓縮・存照片｜V2</div>
<div class="card"><label>① 選擇圖片</label><label class="pick" for="picker">＋ 從照片 / 檔案選取圖片</label><input id="picker" type="file" accept="image/*" multiple><div class="hint">圖片只在你的裝置瀏覽器處理，不會上傳。</div></div>
<div class="card"><label>② 批次命名</label><div class="grid"><div><label style="font-weight:500">名稱</label><input id="prefix" value="flower"></div><div><label style="font-weight:500">起始編號</label><input id="start" type="number" value="1"></div></div><div class="grid" style="margin-top:9px"><div><label style="font-weight:500">編號位數</label><select id="digits"><option value="1">1</option><option value="2">01</option><option value="3" selected>001</option><option value="4">0001</option></select></div><div><label style="font-weight:500">分隔符號</label><select id="sep"><option value="-">flower-001</option><option value="_">flower_001</option><option value="">flower001</option></select></div></div><div style="margin-top:9px"><label style="font-weight:500">輸出格式</label><select id="format"><option value="webp" selected>WEBP</option><option value="jpg">JPG</option><option value="png">PNG</option></select></div></div>
<div class="card"><label>③ 壓縮設定</label><div class="grid"><div><label style="font-weight:500">最大寬度</label><input id="maxw" type="number" value="2000"></div><div><label style="font-weight:500">品質</label><div class="range"><input id="quality" type="range" min="30" max="100" value="80"><b id="qv">80%</b></div></div></div><div class="hint">超過最大寬度才縮小，不會放大。</div></div>
<div class="card" id="selected" hidden><div class="stat"><b>已選圖片</b><span id="count">0 張</span></div><div class="stat"><span>原始容量</span><span id="total">0 B</span></div><div style="display:flex;gap:8px;margin-top:8px"><button class="soft" style="flex:1" id="reverse">↕️ 反轉順序</button><button class="danger" style="flex:1" id="clear">清除全部</button></div><div class="hint">用 ↑ ↓ 調整順序，編號會跟著順序更新。</div><div class="list" id="list"></div></div>
<div class="card"><button class="primary" id="go">✨ 批次處理圖片</button><div class="progress"><div class="bar" id="bar"></div></div><div class="status" id="status">尚未開始</div></div>
<div class="card" id="results" hidden><div class="stat"><b>🎉 處理完成</b><span id="summary"></span></div><button class="soft" style="width:100%;margin-top:8px" id="copy">📋 複製全部檔名</button><div id="resultList"></div><div class="hint">iPhone 請逐張按「儲存」→ 分享選單 →「儲存影像／儲存到照片」；若沒有該選項，長按圖片即可儲存。</div></div></div>
<script>
const $=id=>document.getElementById(id);let files=[],outs=[];
const size=n=>{if(!n)return"0 B";let u=["B","KB","MB","GB"],i=Math.min(3,Math.floor(Math.log(n)/Math.log(1024)));return(n/1024**i).toFixed(i?2:0)+" "+u[i]};
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function fname(i){let p=$("prefix").value.trim()||"flower",n=String(Number($("start").value||1)+i).padStart(Number($("digits").value), "0");return p+$("sep").value+n+"."+$("format").value}
$("quality").oninput=()=>$("qv").textContent=$("quality").value+"%";
$("picker").onchange=()=>{files=[...$("picker").files];outs=[];$("results").hidden=true;draw()};
["prefix","start","digits","sep","format"].forEach(id=>$(id).addEventListener("input",draw));
$("reverse").onclick=()=>{files.reverse();draw()};
function draw(){$("selected").hidden=!files.length;$("count").textContent=files.length+" 張";$("total").textContent=size(files.reduce((a,f)=>a+f.size,0));$("list").innerHTML="";files.forEach((f,i)=>{let r=document.createElement("div");r.className="item";let im=document.createElement("img");im.className="thumb";im.src=URL.createObjectURL(f);let inf=document.createElement("div");inf.className="name";inf.innerHTML="<b>"+esc(fname(i))+"</b><div class=size>"+esc(f.name)+" · "+size(f.size)+"</div>";let bs=document.createElement("div");bs.className="btns";["↑","↓"].forEach((t,j)=>{let b=document.createElement("button");b.className="mini";b.textContent=t;b.disabled=j?i===files.length-1:i===0;b.onclick=()=>{let k=j?i+1:i-1;[files[i],files[k]]=[files[k],files[i]];draw()};bs.append(b)});r.append(im,inf,bs);$("list").append(r)})}
function imgLoad(f){return new Promise((ok,no)=>{let im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{URL.revokeObjectURL(u);ok(im)};im.onerror=()=>no(Error("圖片讀取失敗"));im.src=u})}
function blob(im,fmt,q,mw){let w=im.naturalWidth,h=im.naturalHeight;if(w>mw){h=Math.round(h*mw/w);w=mw}let c=document.createElement("canvas");c.width=w;c.height=h;let x=c.getContext("2d");if(fmt==="jpg"){x.fillStyle="#fff";x.fillRect(0,0,w,h)}x.drawImage(im,0,0,w,h);let mime=fmt==="png"?"image/png":fmt==="jpg"?"image/jpeg":"image/webp";return new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(Error("瀏覽器不支援此格式")),mime,q))}
$("go").onclick=async()=>{if(!files.length){$("status").textContent="請先選擇圖片 📷";return}outs=[];$("results").hidden=true;$("bar").style.width="0%";let fmt=$("format").value,q=+$("quality").value/100,mw=+$("maxw").value||2000;try{for(let i=0;i<files.length;i++){let im=await imgLoad(files[i]),b=await blob(im,fmt,q,mw);outs.push({name:fname(i),blob:b,old:files[i].size});$("bar").style.width=((i+1)/files.length*100)+"%";$("status").textContent=`正在處理 ${i+1} / ${files.length}`;await new Promise(r=>setTimeout(r,0))}showResults();$("status").textContent=`完成！${outs.length} 張圖片已處理 ✨`}catch(e){$("status").textContent="處理失敗："+e.message}};
function showResults(){$("resultList").innerHTML="";let a=outs.reduce((s,o)=>s+o.old,0),b=outs.reduce((s,o)=>s+o.blob.size,0);$("summary").textContent=size(a)+" → "+size(b);outs.forEach(o=>{let r=document.createElement("div");r.className="result";let im=document.createElement("img");im.className="thumb";let u=URL.createObjectURL(o.blob);im.src=u;let inf=document.createElement("div");inf.className="name";inf.innerHTML="<b>"+esc(o.name)+"</b><div class=size>"+size(o.old)+" → "+size(o.blob.size)+"</div>";let a=document.createElement("button");a.className="save";a.type="button";a.textContent="儲存";
a.onclick=async()=>{
  try{
    const file=new File([o.blob],o.name,{type:o.blob.type});
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:o.name});
      $("status").textContent="已開啟分享選單，請選「儲存影像」或「儲存到照片」📱";
    }else{
      const w=window.open();
      if(w){w.document.write('<title>'+esc(o.name)+'</title><img style="max-width:100%" src="'+u+'">');w.document.close();$("status").textContent="請長按圖片 → 儲存到照片 📷";}
      else $("status").textContent="請允許開啟新分頁，或長按圖片儲存";
    }
  }catch(e){
    if(e.name!=="AbortError") $("status").textContent="請長按圖片 → 儲存到照片 📷";
  }
};
r.append(im,inf,a);$("resultList").append(r)});$("results").hidden=false}
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(outs.map(o=>o.name).join("\n"));$("status").textContent="檔名已複製 📋"}catch{}};
$("clear").onclick=()=>{files=[];outs=[];$("picker").value="";$("results").hidden=true;$("bar").style.width="0";$("status").textContent="尚未開始";draw()};draw();
</script></body></html>
